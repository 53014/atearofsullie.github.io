---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}">← 모든 기록</a>
    <p class="eyebrow">A PAGE FROM MY JOURNAL</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.display_date | default: page.date | date: '%Y-%m-%d' }}">{{ page.display_date | default: page.date | date: "%Y년 %m월 %d일" }}</time>
    <a class="edit-link post-edit-link" href="https://github.com/53014/atearofsullie.github.io/edit/main/{{ page.path }}" target="_blank" rel="noopener">이 글의 날짜·내용 수정 ↗</a>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
